global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

frontend http_in
    bind *:80
    mode http
    default_backend app_backend

backend app_backend
    mode http
    balance roundrobin
    option httpchk GET /
    server app1 127.0.0.1:8080 check
