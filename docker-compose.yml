# Standard-Deployment: nutzt das vorgefertigte Image von GitHub Container Registry.
# Kein Build nötig:  docker compose up -d
#
# Für den lokalen Build aus dem Quellcode:
#   docker compose -f docker-compose.build.yml up -d --build

services:
  haproxy-gui:
    image: ghcr.io/bartelluis/haproxy-gui:latest
    container_name: haproxy-gui
    restart: unless-stopped
    ports:
      - "8080:8080"   # Web-GUI
      - "80:80"       # optional: eingebetteter HAProxy (HTTP)
      - "443:443"     # optional: eingebetteter HAProxy (HTTPS)
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me        # unbedingt ändern!
      ENABLE_LOCAL_HAPROXY: "true"     # eingebetteten HAProxy-Cluster "Local" aktivieren
      # GUI_PORT: "8080"
      # SSH_TCP_MAXSEG: "1024"          # Linux-Standard für ausgehendes SSH; "0" deaktiviert die Begrenzung
      # Nach Änderungen mit aktualisiertem Image neu erstellen: docker compose up -d --force-recreate
    volumes:
      - haproxy-gui-data:/data

volumes:
  haproxy-gui-data:
